<svg width="1500" height="620" viewBox="0 0 1500 620" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="aBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111b"/><stop offset="1" stop-color="#111a2a"/></linearGradient>
  <filter id="aShadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
</defs>
<rect width="1500" height="620" rx="26" fill="url(#aBg)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="54" y="64" font-size="38" font-weight="800" fill="#f4f8fb">Request flow</text>
  <text x="54" y="96" font-size="20" fill="#aebdca">Each layer has one job. That is the whole idea.</text>

  <g filter="url(#aShadow)">
    <rect x="48" y="145" width="185" height="125" rx="18" fill="#0f1e2b" stroke="#55d9ff" stroke-width="2"/>
    <text x="72" y="181" font-size="17" font-weight="800" fill="#55d9ff">CLIENT</text>
    <text x="72" y="216" font-size="19" fill="#eef4f7">HTTP request</text>
    <text x="72" y="244" font-size="14" fill="#8fa6b7">browser / mobile / API client</text>

    <rect x="275" y="145" width="185" height="125" rx="18" fill="#0f1e2b" stroke="#58f2ac" stroke-width="2"/>
    <text x="299" y="181" font-size="17" font-weight="800" fill="#58f2ac">ROUTES</text>
    <text x="299" y="216" font-size="19" fill="#eef4f7">Define endpoints</text>
    <text x="299" y="244" font-size="14" fill="#8fa6b7">map URLs to controllers</text>

    <rect x="502" y="145" width="185" height="125" rx="18" fill="#0f1e2b" stroke="#89a9ff" stroke-width="2"/>
    <text x="526" y="181" font-size="17" font-weight="800" fill="#89a9ff">CONTROLLER</text>
    <text x="526" y="216" font-size="19" fill="#eef4f7">Request + response</text>
    <text x="526" y="244" font-size="14" fill="#8fa6b7">orchestrate the request</text>

    <rect x="729" y="145" width="185" height="125" rx="18" fill="#0f1e2b" stroke="#c799ff" stroke-width="2"/>
    <text x="753" y="181" font-size="17" font-weight="800" fill="#c799ff">DTO</text>
    <text x="753" y="216" font-size="19" fill="#eef4f7">Pick input fields</text>
    <text x="753" y="244" font-size="14" fill="#8fa6b7">shape feature input</text>

    <rect x="956" y="145" width="185" height="125" rx="18" fill="#0f1e2b" stroke="#ffc077" stroke-width="2"/>
    <text x="980" y="181" font-size="17" font-weight="800" fill="#ffc077">SERVICE</text>
    <text x="980" y="216" font-size="19" fill="#eef4f7">Business logic</text>
    <text x="980" y="244" font-size="14" fill="#8fa6b7">where actions get implemented</text>

    <rect x="1183" y="145" width="185" height="125" rx="18" fill="#0f1e2b" stroke="#ff7ea5" stroke-width="2"/>
    <text x="1207" y="181" font-size="17" font-weight="800" fill="#ff7ea5">MODEL</text>
    <text x="1207" y="216" font-size="19" fill="#eef4f7">MongoDB data</text>
    <text x="1207" y="244" font-size="14" fill="#8fa6b7">Mongoose schema / model</text>
  </g>

  <g font-size="30" fill="#6f879a" font-weight="700">
    <text x="241" y="218">→</text><text x="468" y="218">→</text><text x="695" y="218">→</text><text x="922" y="218">→</text><text x="1149" y="218">→</text>
  </g>

  <g filter="url(#aShadow)">
    <rect x="559" y="346" width="382" height="112" rx="18" fill="#0c1e1a" stroke="#58f2ac" stroke-width="2"/>
    <text x="589" y="382" font-size="17" font-weight="800" fill="#58f2ac">MONGODB</text>
    <text x="589" y="418" font-size="22" fill="#eef4f7">The database at the edge</text>
    <text x="589" y="442" font-size="14" fill="#8fa6b7">connected before Express starts listening</text>
  </g>
  <path d="M1275 272 C1275 314 1105 322 926 401" fill="none" stroke="#6f879a" stroke-width="2.5" stroke-dasharray="7 9"/>
  <text x="1260" y="317" font-size="14" fill="#8fa6b7">Mongoose</text>

  <g>
    <rect x="54" y="508" width="430" height="60" rx="16" fill="#101e2c" stroke="#273d50"/>
    <text x="76" y="535" font-size="15" font-weight="800" fill="#89a9ff">COMMON</text>
    <text x="160" y="535" font-size="15" fill="#b9c7d1">db config • error handler • response helpers</text>

    <rect x="535" y="508" width="430" height="60" rx="16" fill="#101e2c" stroke="#273d50"/>
    <text x="557" y="535" font-size="15" font-weight="800" fill="#58f2ac">MODULE</text>
    <text x="642" y="535" font-size="15" fill="#b9c7d1">auth routes • DTOs • controller • service • model</text>

    <rect x="1016" y="508" width="430" height="60" rx="16" fill="#101e2c" stroke="#273d50"/>
    <text x="1038" y="535" font-size="15" font-weight="800" fill="#c799ff">HONEST SCAFFOLD</text>
    <text x="1176" y="535" font-size="15" fill="#b9c7d1">auth actions return 501 until implemented</text>
  </g>
</g>
</svg>