<svg width="1800" height="820" viewBox="0 0 1800 820" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1800" y2="820" gradientUnits="userSpaceOnUse">
    <stop stop-color="#07111D"/><stop offset="1" stop-color="#0D1825"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7DB6E8"/></marker>
  <style>
    .title{font:700 46px Inter,system-ui,sans-serif}.sub{font:400 22px Inter,system-ui,sans-serif}
    .h{font:700 23px Inter,system-ui,sans-serif}.body{font:400 18px Inter,system-ui,sans-serif}
    .small{font:400 15px Inter,system-ui,sans-serif}.code{font:700 15px ui-monospace,SFMono-Regular,Menlo,monospace}
  </style>
</defs>
<rect width="1800" height="820" rx="28" fill="url(#bg)"/>
<g opacity=".13" stroke="#3A5369"><path d="M0 120H1800"/><path d="M0 240H1800"/><path d="M0 360H1800"/><path d="M0 480H1800"/><path d="M0 600H1800"/><path d="M0 720H1800"/><path d="M150 0V820"/><path d="M300 0V820"/><path d="M450 0V820"/><path d="M600 0V820"/><path d="M750 0V820"/><path d="M900 0V820"/><path d="M1050 0V820"/><path d="M1200 0V820"/><path d="M1350 0V820"/><path d="M1500 0V820"/><path d="M1650 0V820"/></g>

<text x="60" y="70" class="title" fill="#F7FAFC">Express + MongoDB Backend Architecture</text>
<text x="60" y="108" class="sub" fill="#AFC0CE">The actual request path in <tspan fill="#4DF2A8">express-mongo-start</tspan> — every layer has a clear responsibility.</text>

<rect x="42" y="145" width="1716" height="330" rx="24" fill="#091522" stroke="#20384C" filter="url(#shadow)"/>
<text x="68" y="182" class="h" fill="#EAF2F7">01 · Request flow</text>
<text x="68" y="209" class="small" fill="#91A6B5">GET / or POST /api/auth/* enters Express and follows the feature pipeline.</text>

<g filter="url(#shadow)">
  <rect x="64" y="250" width="205" height="140" rx="18" fill="#101F2F" stroke="#6FB8FF" stroke-width="2"/>
  <text x="87" y="283" class="h" fill="#6FB8FF">CLIENT</text><text x="87" y="315" class="body" fill="#F0F5F8">HTTP request</text>
  <text x="87" y="346" class="small" fill="#9CB0BF">browser / mobile / API client</text>

  <rect x="323" y="250" width="205" height="140" rx="18" fill="#10231F" stroke="#4DF2A8" stroke-width="2"/>
  <text x="346" y="283" class="h" fill="#4DF2A8">app.js</text><text x="346" y="315" class="body" fill="#F0F5F8">Express setup</text>
  <text x="346" y="346" class="small" fill="#9CB0BF">CORS + JSON + route mounting</text>

  <rect x="582" y="250" width="225" height="140" rx="18" fill="#1B1830" stroke="#C7A3FF" stroke-width="2"/>
  <text x="605" y="283" class="h" fill="#C7A3FF">auth/routes.js</text><text x="605" y="315" class="body" fill="#F0F5F8">Defines endpoints</text>
  <text x="605" y="346" class="small" fill="#9CB0BF">register · login · forgot-password</text>

  <rect x="861" y="250" width="225" height="140" rx="18" fill="#102337" stroke="#6FB8FF" stroke-width="2"/>
  <text x="884" y="283" class="h" fill="#6FB8FF">controller.js</text><text x="884" y="315" class="body" fill="#F0F5F8">Request → response</text>
  <text x="884" y="346" class="small" fill="#9CB0BF">DTO → service → ApiResponse</text>

  <rect x="1140" y="250" width="190" height="140" rx="18" fill="#2A2110" stroke="#FFC06B" stroke-width="2"/>
  <text x="1163" y="283" class="h" fill="#FFC06B">Dto/</text><text x="1163" y="315" class="body" fill="#F0F5F8">Picks fields</text>
  <text x="1163" y="346" class="small" fill="#9CB0BF">one DTO per auth action</text>

  <rect x="1384" y="250" width="220" height="140" rx="18" fill="#2A1A16" stroke="#FF9656" stroke-width="2"/>
  <text x="1407" y="283" class="h" fill="#FF9656">service.js</text><text x="1407" y="315" class="body" fill="#F0F5F8">Business logic</text>
  <text x="1407" y="346" class="small" fill="#FFBE93">currently throws 501 placeholders</text>

  <rect x="1630" y="250" width="98" height="140" rx="18" fill="#14231E" stroke="#4DF2A8" stroke-width="2"/>
  <text x="1647" y="283" class="h" fill="#4DF2A8">DB</text><text x="1647" y="315" class="body" fill="#F0F5F8">Model</text><text x="1647" y="346" class="small" fill="#9CB0BF">future</text>
</g>

<g stroke="#7DB6E8" stroke-width="3" marker-end="url(#arrow)">
  <path d="M274 320H313"/><path d="M533 320H572"/><path d="M812 320H851"/><path d="M1091 320H1130"/><path d="M1335 320H1374"/><path d="M1609 320H1620"/>
</g>

<rect x="62" y="415" width="610" height="38" rx="12" fill="#0D211B" stroke="#4DF2A8"/>
<text x="83" y="440" class="code" fill="#4DF2A8">POST /api/auth/register</text>
<text x="355" y="440" class="small" fill="#A7B9C7">→ controller → DTO → service</text>

<rect x="690" y="415" width="1038" height="38" rx="12" fill="#151C28" stroke="#344C61"/>
<text x="710" y="440" class="small" fill="#D8E2E8">The scaffold intentionally stops before persistence: implement the service, then wire model/database operations.</text>

<rect x="42" y="505" width="1716" height="270" rx="24" fill="#091522" stroke="#20384C"/>
<text x="68" y="542" class="h" fill="#EAF2F7">02 · Where the code lives</text>
<text x="68" y="569" class="small" fill="#91A6B5">Shared infrastructure stays under src/common; feature-specific code stays under src/module/auth.</text>

<rect x="64" y="595" width="365" height="135" rx="18" fill="#0F1D2A" stroke="#6FB8FF"/>
<text x="88" y="628" class="h" fill="#6FB8FF">src/common/</text>
<text x="88" y="657" class="code" fill="#DCE8EF">config/db.js</text><text x="225" y="657" class="small" fill="#93A8B8">MongoDB connection</text>
<text x="88" y="682" class="code" fill="#DCE8EF">middleware/</text><text x="225" y="682" class="small" fill="#93A8B8">error handler</text>
<text x="88" y="707" class="code" fill="#DCE8EF">utils/</text><text x="225" y="707" class="small" fill="#93A8B8">ApiError + ApiResponse</text>

<rect x="455" y="595" width="430" height="135" rx="18" fill="#10231F" stroke="#4DF2A8"/>
<text x="479" y="628" class="h" fill="#4DF2A8">src/module/auth/</text>
<text x="479" y="657" class="code" fill="#DCE8EF">Dto/</text><text x="548" y="657" class="small" fill="#93A8B8">input field mapping</text>
<text x="479" y="682" class="code" fill="#DCE8EF">routes.js</text><text x="585" y="682" class="small" fill="#93A8B8">endpoint definitions</text>
<text x="479" y="707" class="code" fill="#DCE8EF">controller.js · service.js</text><text x="710" y="707" class="small" fill="#93A8B8">request + business logic</text>

<rect x="910" y="595" width="365" height="135" rx="18" fill="#25151F" stroke="#FF87BE"/>
<text x="934" y="628" class="h" fill="#FF87BE">model.js</text>
<text x="934" y="657" class="code" fill="#DCE8EF">User schema</text><text x="1065" y="657" class="small" fill="#93A8B8">name · email · passwordHash</text>
<text x="934" y="682" class="small" fill="#93A8B8">Mongoose model for MongoDB data</text>
<text x="934" y="707" class="small" fill="#F7B6D4">not used by auth services yet</text>

<rect x="1300" y="595" width="428" height="135" rx="18" fill="#171827" stroke="#FFC06B"/>
<text x="1324" y="628" class="h" fill="#FFC06B">server.js + app.js</text>
<text x="1324" y="657" class="small" fill="#DCE8EF">server.js loads .env, connects MongoDB, starts Express</text>
<text x="1324" y="683" class="small" fill="#DCE8EF">app.js configures middleware, routes, and error handling</text>
<text x="1324" y="709" class="small" fill="#FFC98E">Clean flow → clear responsibilities → easy to extend</text>
</svg>